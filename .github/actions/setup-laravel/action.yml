name: 'Setup Laravel Environment'
description: 'Sets up PHP, Node.js, and Laravel dependencies for CI builds'

runs:
  using: 'composite'
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: 8.6
        extensions: mbstring, pdo_sqlite, gd, iconv, json, pdo

    - name: Install PHP Dependencies
      shell: bash
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Setup Laravel environment
      shell: bash
      run: |
        php -r "file_exists('.env') || copy('.env.example', '.env');"
        echo "FATHOM_SITE=${{ env.FATHOM_SITE }}" >> .env
        php artisan key:generate --no-interaction
        chmod -R 755 storage bootstrap/cache

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install Node Dependencies
      shell: bash
      run: npm ci

    - name: Build assets
      shell: bash
      run: npm run build

    - name: Create database
      shell: bash
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Execute migrations and seeders
      shell: bash
      run: php artisan migrate --force --seed
