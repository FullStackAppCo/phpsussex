name: Tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Laravel Environment
        uses: ./.github/actions/setup-laravel

      - name: Run tests
        run: composer test
